name: Scheduled DistWitness scan

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distwitness-generated-publication
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and build with read-only source access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out trusted default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Restore the workflow state cache when available
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/state.json
          key: distwitness-state-${{ github.run_id }}
          restore-keys: |
            distwitness-state-

      - name: Run the live observation and static build
        run: python -m distwitness run --no-cache

      - name: Audit generated output
        run: python scripts/audit_repository.py --site site-output

      - name: Save the refreshed workflow state cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/state.json
          key: distwitness-state-${{ github.run_id }}

      - name: Assemble audited Pages payload
        run: |
          mkdir -p generated
          cp -R site-output/. generated/
          touch generated/.nojekyll
          test ! -e generated/.distwitness-state
          test ! -e generated/.github
          test ! -e generated/pyproject.toml

      - name: Upload generated payload between trust boundaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distwitness-generated
          path: generated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Deploy audited site to GitHub Pages
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download the already-audited generated payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distwitness-generated
          path: generated

      - name: Recheck the deployment boundary
        run: |
          test -f generated/index.html
          test -f generated/.nojekyll
          test ! -e generated/.distwitness-state
          test ! -e generated/state.json
          test ! -e generated/.github
          test ! -e generated/pyproject.toml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package the audited Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: generated
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
