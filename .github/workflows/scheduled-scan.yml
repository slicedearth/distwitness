name: Scheduled DistWitness scan

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distwitness-generated-publication
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and build with read-only source access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out trusted default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Restore the workflow state cache when available
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: state/state.json
          key: distwitness-state-${{ github.run_id }}
          restore-keys: |
            distwitness-state-

      - name: Run the live observation and static build
        run: python -m distwitness run --no-cache

      - name: Audit generated output
        run: python scripts/audit_repository.py --site site-output

      - name: Save the refreshed workflow state cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: state/state.json
          key: distwitness-state-${{ github.run_id }}

      - name: Assemble generated-branch payload
        run: |
          mkdir -p generated
          cp -R site-output/. generated/
          touch generated/.nojekyll
          test ! -e generated/.distwitness-state
          test ! -e generated/.github
          test ! -e generated/pyproject.toml

      - name: Upload generated payload between trust boundaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distwitness-generated
          path: generated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Update generated branch
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository for authenticated branch update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publish-branch
          persist-credentials: true

      - name: Download the already-audited generated payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distwitness-generated
          path: generated

      - name: Replace generated branch only when output changed
        working-directory: publish-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../generated/. .
          test ! -e .github
          test ! -e pyproject.toml
          git add --all
          if git diff --cached --quiet; then
            echo "Generated output is unchanged."
            exit 0
          fi
          git commit -m "Update generated DistWitness observation"
          git push origin gh-pages
